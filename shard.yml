name: ovh-api
version: 0.2.1

description: >
  Client Crystal pur (stdlib uniquement) pour l'API OVHcloud v1.
  Couvre les endpoints nécessaires au provisioning : clés SSH, serveurs
  dédiés (install, suivi de tâche), DNS inverse. Zéro dépendance externe,
  signature X-Ovh-Signature calculée localement.

authors:
