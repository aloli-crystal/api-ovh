name: api-ovh
version: 0.4.2

description: >
  Client Crystal pur (stdlib uniquement) pour l'API OVHcloud v1.
  Couvre les endpoints nécessaires au provisioning : clés SSH, serveurs
  dédiés (install, suivi de tâche, displayName, IPs), DNS inverse,
  zones DNS (records, refresh), génération auto d'une consumer key
  avec access rules exactes. Zéro dépendance externe, signature
  X-Ovh-Signature calculée localement.

authors:
  - ALOLI sas <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
